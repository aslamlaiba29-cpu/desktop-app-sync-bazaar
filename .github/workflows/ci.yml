name: Microservices CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build and spin up containers
      run: docker-compose up -d --build
      
    - name: Wait for services
      run: sleep 10
      
    - name: Test Gateway Health
      run: curl -f http://localhost:5000/health || exit 1
      
    - name: Test Process Service Health
      run: curl -f http://localhost:5001/health || exit 1
      
    - name: Test Frontend Service
      run: curl -f http://localhost:3000 || exit 1
      
    - name: Tear down
      run: docker-compose down
